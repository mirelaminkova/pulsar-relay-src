name: Validate component
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check credential configuration
        run: python -m unittest discover -s tests -v
      - name: Install Ansible dependencies
        run: |
          python -m pip install 'ansible-core>=2.16,<2.18'
          ansible-galaxy install -r requirements.yml
      - name: Validate Ansible syntax
        run: ansible-playbook -i localhost, playbook.yml --syntax-check
      - name: Test relay delivery and persistence
        run: python scripts/test_relay.py
