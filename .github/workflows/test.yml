---
name: Validate component
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # pytest and the linters run in checks.yml; the deployment in deploy.yml.
  syntax:
    name: syntax check (${{ matrix.ansible }})
    strategy:
      fail-fast: false
      matrix:
        # SRC's external Ansible plugin runs the playbook with remote_ansible_version 14.6.0
        # (ansible-core 2.21); requirements-dev.txt's ansible-core is what contributors run.
        ansible: ["ansible==14.6.0", "ansible-core~=2.18.20"]
    runs-on: ubuntu-24.04
    env:
      ANSIBLE: ${{ matrix.ansible }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Ansible
        run: |
          python -m pip install "$ANSIBLE"
          ansible --version
      - name: Install Ansible dependencies
        run: ansible-galaxy install -r requirements.yml
      - name: Validate Ansible syntax
        run: ansible-playbook -i localhost, playbook.yml --syntax-check
