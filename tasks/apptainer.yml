---
# Apptainer for the co-located Pulsar, installed from the same PPA as the SRC
# Galaxy component. The package is unprivileged (no setuid starter) and ships a
# `singularity` command, which is what Galaxy's singularity_enabled destinations run.
- name: Download Apptainer PPA key
  ansible.builtin.get_url:
    url: "{{ apptainer_key_url }}"
    dest: "{{ apptainer_key_location }}"
    mode: "0644"

- name: Add Apptainer apt repository
  ansible.builtin.apt_repository:
    repo: deb [signed-by={{ apptainer_key_location }}] {{ apptainer_repo_url }} {{ ansible_distribution_release }} main
    state: present
    filename: apptainer
    update_cache: true

- name: Install Apptainer
  ansible.builtin.apt:
    name: apptainer
    state: present

# Galaxy resolves the container image and builds the `singularity exec` command;
# the SRC Galaxy component cannot pass singularity_volumes with commas through its
# one-line relay parameter. Binding /cvmfs system-wide gives every container the
# reference data and images Galaxy's command line refers to.
- name: Bind /cvmfs into every Apptainer container
  ansible.builtin.lineinfile:
    path: /etc/apptainer/apptainer.conf
    regexp: '^bind path = /cvmfs$'
    line: bind path = /cvmfs
    insertafter: '^bind path = '
  when: _relay_pulsar_cvmfs | bool
