services:
  valkey:
    image: valkey/valkey:9.0-trixie
    restart: unless-stopped
    command:
      - valkey-server
      - /run/secrets/valkey_config
    volumes:
      - valkey-data:/data
    secrets:
      - valkey_config
    networks:
      - storage
    healthcheck:
      test: [CMD-SHELL, 'printf "AUTH %s\nPING\n" "$$(sed -n "s/^requirepass //p" /run/secrets/valkey_config)" | valkey-cli --raw | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  relay:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy
    ports:
      - "127.0.0.1:${RELAY_PORT:-8080}:8080"
    environment:
      PULSAR_STORAGE_BACKEND: valkey
      PULSAR_VALKEY_HOST: valkey
      PULSAR_VALKEY_PORT: "6379"
      PULSAR_CONFIG_FILE: /run/secrets/relay_config.yaml
      SRC_ADMIN_POLICY_FILE: /etc/relay-policy/admins.json
      PULSAR_TRUSTED_HOSTS: ${PULSAR_TRUSTED_HOSTS:?Run scripts/configure.py first}
      PULSAR_ALLOWED_ORIGINS: ${PULSAR_ALLOWED_ORIGINS:?Run scripts/configure.py first}
      # Bounded Valkey (files/valkey.conf: maxmemory 512mb, noeviction).
      # Keep messages 7 days, enough for a Pulsar or Galaxy outage, and at
      # most 2000 per topic: 2000 x (largest measured job setup + final
      # status entry) is about half of maxmemory. See README "Storage limits".
      PULSAR_PERSISTENT_TIER_RETENTION: "604800"
      PULSAR_MAX_MESSAGES_PER_TOPIC: "2000"
      # Galaxy and Pulsar log in by password and renew 5 minutes before
      # expiry; every login stores a refresh-token record for the TTL.
      PULSAR_ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      PULSAR_REFRESH_TOKEN_TTL_DAYS: "7"
      PULSAR_LOG_LEVEL: INFO
    secrets:
      - source: relay_config
        target: relay_config.yaml
    volumes:
      - ./.policy:/etc/relay-policy:ro
    networks:
      - storage
      - frontend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # /ready must report ready, and Valkey must accept a write with memory headroom.
      test: [CMD, python, -m, relay_src.healthcheck]
      interval: 10s
      timeout: 6s
      start_period: 60s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  storage:
    internal: true
  frontend:

volumes:
  valkey-data:

secrets:
  relay_config:
    file: ./.secrets/relay.json
  valkey_config:
    file: ./.secrets/valkey.conf
