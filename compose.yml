services:
  valkey:
    image: valkey/valkey:9.0-trixie
    restart: unless-stopped
    command:
      - valkey-server
      - /run/secrets/valkey_config
    volumes:
      - valkey-data:/data
    secrets:
      - valkey_config
    networks:
      - storage
    healthcheck:
      test: [CMD-SHELL, 'printf "AUTH %s\nPING\n" "$$(sed -n "s/^requirepass //p" /run/secrets/valkey_config)" | valkey-cli --raw | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  relay:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy
    ports:
      - "127.0.0.1:${RELAY_PORT:-8080}:8080"
    environment:
      PULSAR_STORAGE_BACKEND: valkey
      PULSAR_VALKEY_HOST: valkey
      PULSAR_VALKEY_PORT: "6379"
      PULSAR_CONFIG_FILE: /run/secrets/relay_config.yaml
      SRC_ADMIN_POLICY_FILE: /etc/relay-policy/admins.json
      PULSAR_TRUSTED_HOSTS: ${PULSAR_TRUSTED_HOSTS:?Run scripts/configure.py first}
      PULSAR_ALLOWED_ORIGINS: ${PULSAR_ALLOWED_ORIGINS:?Run scripts/configure.py first}
      PULSAR_PERSISTENT_TIER_RETENTION: "0"
      PULSAR_MAX_MESSAGES_PER_TOPIC: "100000"
      PULSAR_LOG_LEVEL: INFO
    secrets:
      - source: relay_config
        target: relay_config.yaml
    volumes:
      - ./.policy:/etc/relay-policy:ro
    networks:
      - storage
      - frontend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      start_period: 60s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  storage:
    internal: true
  frontend:

volumes:
  valkey-data:

secrets:
  relay_config:
    file: ./.secrets/relay.json
  valkey_config:
    file: ./.secrets/valkey.conf
