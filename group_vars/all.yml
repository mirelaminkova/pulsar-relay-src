---
relay_install_dir: /opt/pulsar-relay
relay_port: 8080
# Override in SRC component parameters if ansible_fqdn is not the public hostname.
relay_public_url: "https://{{ workspace_fqdn | default(ansible_fqdn, true) }}"
relay_admin_co_group: src_co_admin
relay_configure_src_proxy: true
# Built-in non-admin relay account shared by one Galaxy/Pulsar pair, and the
# topic prefix both ends must use. Shown on the SRAM-protected welcome page.
relay_pair_username: galaxy-pulsar
# Optional pair password from the SRC wizard; empty means generated on the workspace.
relay_pair_password: ""
relay_topic_prefix: src
relay_welcome_dir: /srv/static

# Galaxy BYOC ("bring your own compute") mode: the byoc_pulsar form in Galaxy's user
# preferences, which byoc-sync (sanjaysrikakulam/elixir_biohackathon_2026_project1,
# byoc-sync/) turns into Galaxy's runner and TPV destination. Its relay backend names
# the relay account and topic prefix galaxy_<BYOC name>_byoc, as it names the RabbitMQ
# user; in BYOC mode this relay uses exactly those, so relay_pair_username and
# relay_topic_prefix are ignored. The BYOC name is relay_byoc_name, else the one kept in
# <relay_install_dir>/pair.json, else generated. Use _relay_byoc, never relay_byoc.
relay_byoc: false
relay_byoc_name: ""
_relay_byoc: "{{ relay_byoc | default(false, true) | bool }}"
# The pair account and BYOC name in effect. The playbook sets both from pair.json
# (written by scripts/configure.py) right after configuring; use these and
# _relay_topic_prefix, never relay_pair_username or relay_topic_prefix, in templates.
_relay_pair_username: "{{ relay_pair_username }}"
_relay_byoc_name: "{{ relay_byoc_name | default('', true) }}"
_relay_topic_prefix: "{{ ('galaxy_' ~ _relay_byoc_name ~ '_byoc') if _relay_byoc | bool else relay_topic_prefix }}"
# byoc-sync's names for this BYOC name (its usegalaxy.eu site config, sites/eu.yml), for
# the welcome page and a hand-edited job_conf.yml.
_relay_byoc_galaxy:
  runner_id: "pulsar_eu_{{ _relay_byoc_name }}_byoc"
  destination_id: "pulsar_{{ _relay_byoc_name }}_byoc_tpv"
  relay_vault_var: "relay_password_galaxy_{{ _relay_byoc_name }}_byoc"
  tag: "{{ _relay_byoc_name | replace('_', '-') }}-byoc-pulsar"
# The byoc_pulsar form for this relay, without the password (the welcome page adds
# _relay_pair_password). relay_username and relay_topic_prefix are what byoc-sync fills in
# when they are left empty. The limits and nfs_path only with the co-located Pulsar, which
# runs the jobs here: byoc-sync derives jobs_directory (<nfs_path>/staging),
# persistence_directory (<nfs_path>/persisted_data) and SINGULARITY_CACHEDIR
# (<nfs_path>/var/database/container_cache) from nfs_path, which is Pulsar's root.
_relay_byoc_form: >-
  {{ {'backend': 'relay',
      'username': _relay_byoc_name,
      'relay_url': relay_public_url | regex_replace('/+$', ''),
      'relay_username': _relay_pair_username,
      'relay_topic_prefix': _relay_topic_prefix}
     | combine({'max_accepted_cores': ansible_facts['processor_vcpus'] | default(1) | int,
                'max_accepted_mem': [((ansible_facts['memtotal_mb'] | default(1024) | int)
                                      * 0.9 / 1024) | int, 1] | max,
                'min_accepted_gpus': 0,
                'max_accepted_gpus': 0,
                'nfs_path': _relay_pulsar_root} if relay_install_pulsar | bool else {}) }}
# Pulsar publishes this topic when it binds to the relay (pulsar.messaging.bind_relay);
# Galaxy's first job creates the job_setup topic. Both under the pair account.
_relay_pulsar_manager: "{{ relay_pulsar_managers | list | first }}"
_relay_manager_suffix: "{{ '' if _relay_pulsar_manager == '_default_' else '_' ~ _relay_pulsar_manager }}"
_relay_capabilities_topic: "{{ _relay_topic_prefix }}_pulsar_capabilities{{ _relay_manager_suffix }}"
_relay_job_setup_topic: "{{ _relay_topic_prefix }}_job_setup{{ _relay_manager_suffix }}"
# The connection state (connected, waiting, error; unknown before the check runs, e.g. in
# check mode), recorded by tasks/connection.yml in relay_byoc_state_file with the form
# (never the password) and shown on the welcome page.
_relay_byoc_state: {"state": "unknown", "message": "", "checked_at": "", "galaxy_seen": false}
relay_byoc_state_file: "{{ relay_install_dir }}/byoc-connection.json"

# Optional Pulsar on the same workspace, in relay mode (NEMO-style: pulsar-app
# plus pulsar-relay-client in a venv, webless). It connects to this relay over
# 127.0.0.1 with the built-in pair account, so no credentials are copied.
relay_install_pulsar: false
relay_pulsar_user: pulsar
# Empty (as SRC passes an unset parameter) means /var/lib/pulsar; set it to
# attached storage for larger data. Use _relay_pulsar_root, never this directly.
relay_pulsar_root: ""
_relay_pulsar_root: "{{ (relay_pulsar_root | default('', true) | string | trim) or '/var/lib/pulsar' }}"
relay_pulsar_venv: /opt/pulsar/venv
relay_pulsar_config_dir: /opt/pulsar/config
relay_pulsar_staging_dir: "{{ _relay_pulsar_root }}/staging"
relay_pulsar_persistence_dir: "{{ _relay_pulsar_root }}/persisted_data"
# SINGULARITY_CACHEDIR of byoc-sync's destination (<nfs_path>/var/database/container_cache).
relay_pulsar_container_cache_dir: "{{ _relay_pulsar_root }}/var/database/container_cache"
# Versions run by usegalaxy.eu's NEMO endpoint against the relay; keep the
# client in step with the relay release (v0.2.1 plus fixes in this component).
relay_pulsar_version: "0.15.15"
relay_pulsar_relay_client_version: "0.2.1"
# Let Pulsar run tools in Docker containers (Docker is already installed for
# the relay). Membership of the docker group is equivalent to root on the host.
relay_pulsar_docker: true
# Install Apptainer (with its `singularity` command) so Galaxy environments can
# set singularity_enabled: true on this Pulsar, as the SRC Galaxy component does
# for its own singularity destination. Unprivileged: no setuid starter.
relay_pulsar_apptainer: true
# Mount the Galaxy project's CVMFS repositories on this workspace, as the Galaxy
# component does with src_galaxy_cvmfs. Jobs then find the same reference data
# (/cvmfs/data.galaxyproject.org) and Singularity images
# (/cvmfs/singularity.galaxyproject.org) as Galaxy, so a tool's command line
# and container image resolve on both sides. Only used with relay_install_pulsar.
relay_pulsar_cvmfs: true
_relay_pulsar_cvmfs: "{{ relay_install_pulsar | bool and relay_pulsar_cvmfs | default(true, true) | bool }}"
# galaxyproject.cvmfs client settings, identical to the SRC Galaxy component.
cvmfs_role: client
galaxy_cvmfs_repos_enabled: true
cvmfs_quota_limit: 8000
galaxy_cvmfs_server_urls:
  - domain: galaxyproject.org
    use_geoapi: true
    urls:
      - "http://cvmfs1-ufr0.galaxyproject.eu/cvmfs/@fqrn@"
      - "http://cvmfs1-psu0.galaxyproject.org/cvmfs/@fqrn@"
# Apptainer apt repository, as in the SRC Galaxy component.
apptainer_repo_url: https://ppa.launchpadcontent.net/apptainer/ppa/ubuntu
apptainer_key_url: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xf6b0f5193d4f3301ef491ff0afe36534fc6218ae
apptainer_key_location: /usr/share/keyrings/apptainer.asc
# No Slurm here: jobs run directly on this workspace.
relay_pulsar_managers:
  _default_:
    type: queued_python
    num_concurrent_jobs: "{{ [ansible_processor_vcpus | default(1) | int - 1, 1] | max }}"
# Staging directory Galaxy must use (jobs_directory); the welcome page shows it.
relay_galaxy_jobs_directory: "{{ relay_pulsar_staging_dir if relay_install_pulsar | bool else '/mnt/pulsar/files/staging' }}"
docker_install_compose_plugin: true
docker_install_compose: false
nginx_reverse_proxy_locations:
  # Welcome page with connection details, as in the SRC Pulsar component.
  # The relay itself serves nothing at exactly "/" (404), so only this exact
  # match is taken away from it; every other path still reaches the relay.
  - name: pulsar-relay-welcome
    location: '= /'
    auth: sram
    root: "{{ relay_welcome_dir }}/"
    try_files: $uri/index.html =404
  - name: pulsar-relay
    location: /
    proxy_pass: "http://127.0.0.1:{{ relay_port }}"
    auth: noauth
    proxy_set_header:
      X-SRC-User: '""'
      X-SRC-Proxy-Secret: '""'
    proxy_http_version: "1.1"
    proxy_buffering: "off"
    proxy_read_timeout: "300"
    proxy_send_timeout: "300"
    client_max_body_size: "1m"
