# Defaults for SRC component parameters. Secrets are generated on the workspace.
relay_port: 8080
relay_admin_co_group: src_co_admin
relay_pair_username: galaxy-pulsar
# Leave empty to generate a password on the workspace (recommended).
relay_pair_password: ""
relay_topic_prefix: src
# "true" also installs Pulsar on this workspace, connected to this relay.
relay_install_pulsar: "false"
# With relay_install_pulsar, mount the Galaxy CVMFS repositories (reference data and
# Singularity images under /cvmfs) for that Pulsar. "false" leaves CVMFS out.
relay_pulsar_cvmfs: "true"
# "true": Galaxy BYOC mode. The pair account becomes galaxy_<relay_byoc_name>_byoc, as
# byoc-sync names a BYOC endpoint, and the welcome page shows the byoc_pulsar form.
relay_byoc: "false"
# The BYOC name: 3-32 of a-z 0-9 _, starting with a letter, not ending in _ or _byoc,
# without __. Empty: generated ("src" and 8 hex digits) and kept on the workspace.
relay_byoc_name: ""
# Add relay_public_url as a component parameter if hostname autodetection is wrong.
