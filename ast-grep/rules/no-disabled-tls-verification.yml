---
id: no-disabled-tls-verification
language: python
severity: error
message: Do not switch off TLS certificate or hostname verification.
note: >-
  Galaxy and Pulsar send the pair password and job messages to the relay over HTTPS; without
  certificate and hostname verification anyone on the path could impersonate the relay and
  collect the password and the jobs.
rule:
  any:
    - pattern: ssl.CERT_NONE
    - pattern: ssl.CERT_OPTIONAL
    - pattern: ssl._create_unverified_context
    - pattern: $CONTEXT.check_hostname = False
    - pattern: $CONTEXT.verify_mode = 0
    # requests and friends: verify=False
    - kind: keyword_argument
      all:
        - has: {field: name, regex: ^verify$}
        - has: {field: value, kind: "false"}
    # from ssl import CERT_NONE
    - kind: identifier
      regex: ^(CERT_NONE|CERT_OPTIONAL)$
      not:
        inside:
          kind: attribute
